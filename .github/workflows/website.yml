# Uploads website/ (plus the app icon and the App Store screenshots) to
# https://vandijkcloud.nl/Scaleway-ControlRoom/ over FTP.
#
# Repository secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD. The FTP user is
# locked to the folder served at that URL, so its root (/) is the site's root.
# FTP-Deploy-Action keeps its sync state there and only ever deletes files it
# uploaded itself.
name: Website

on:
  push:
    branches: [master]
    paths: [website/**, AppStore/screenshots/**, ControlRoom/Resources/Assets.xcassets/AppIcon.appiconset/**, .github/workflows/website.yml]
  workflow_run:
    workflows: [Screenshots]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # After the Screenshots workflow, take master with its new commit.
          ref: master

      - name: Assemble the site
        run: |
          mkdir -p site/screenshots
          cp -R website/. site/
          cp ControlRoom/Resources/Assets.xcassets/AppIcon.appiconset/icon.png site/icon.png
          cp AppStore/screenshots/en-US/*.png site/screenshots/ 2>/dev/null || echo "No screenshots yet."
          find site -type f | sort

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: /
