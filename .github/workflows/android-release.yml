# Builds the Android app, signed with the upload key, for one channel:
#   play    the bundle, Pro through Play Billing (-Pstore=play), uploaded to
#           Google Play's internal testing track. Every push to master that
#           changes the Android app does this. Promote it to production in the
#           Play Console.
#   github  the APK as a GitHub Release, every feature free (-Pstore=github).
#           Obtainium and the website's download link pick it up there.
#           Manual only.
#
# Repository secrets (android/DISTRIBUTION.md says how to make the key,
# android/PLAY_STORE.md how to make the service account):
#   UPLOAD_KEYSTORE_BASE64    the upload keystore (.jks), base64 encoded
#   UPLOAD_KEYSTORE_PASSWORD  its password
#   UPLOAD_KEY_ALIAS          the key's alias
#   UPLOAD_KEY_PASSWORD       the key's password
# Repository variables (secrets work too) for the upload to Play, without a key: GitHub proves
# to Google Cloud that the run is this repository's (Workload Identity
# Federation), and may then act as a service account with release rights in
# the Play Console. android/PLAY_STORE.md sets them up.
#   PLAY_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
#   PLAY_SERVICE_ACCOUNT             github-upload@<project>.iam.gserviceaccount.com
# Every release must be signed with this same key, or Play and phones refuse
# the update.
# Repository variable PLAY_RELEASE_STATUS: `completed` (the default) sends the
# release straight to the internal testers; `draft` leaves it for you to roll
# out in the Play Console. A Play app that has never been published only
# accepts drafts.
name: Android release

on:
  push:
    branches: [master]
    paths: [android/**, .github/workflows/android-release.yml]
  workflow_dispatch:
    inputs:
      channel:
        description: Where the build goes
        type: choice
        options: [play, github]
        default: play
      upload_build:
        description: Build and upload the app
        type: boolean
        default: true
      push_listing:
        description: "Play: push the store listing and graphics (android/PlayStore)"
        type: boolean
        default: false
      push_subscriptions:
        description: "Play: create or update the Pro subscription (android/PlayStore/subscriptions.json)"
        type: boolean
        default: false

permissions:
  contents: write
  # Proves to Google Cloud that the run is this repository's.
  id-token: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # A push has no inputs: it builds and goes to Google Play.
  CHANNEL: ${{ inputs.channel || 'play' }}
  # (Not `inputs.upload_build != false`: in expressions a push's missing
  # input equals false.)
  BUILD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_build }}

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count; a shallow clone would report 1.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Validate the Play Store listing
        run: python3 scripts/validate_listing.py

      - name: Write the upload key
        if: env.BUILD == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See android/DISTRIBUTION.md."
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Tests and build
        if: env.BUILD == 'true'
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          number=$(git rev-list --count HEAD)
          echo "Building as build $number"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          case "$CHANNEL" in
            github) task=assembleRelease; store=github ;;
            play) task=bundleRelease; store=play ;;
          esac
          ./gradlew :kit:test :app:testDebugUnitTest ":app:$task" -Pstore="$store" -PversionCode="$number" --console=plain

      - name: Publish the GitHub release
        if: env.CHANNEL == 'github' && env.BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marketing=$(grep -oP 'versionName = "\K[0-9.]+(?=\.\$versionCode")' app/build.gradle.kts)
          version="$marketing.$BUILD_NUMBER"
          apk="$RUNNER_TEMP/ControlRoom-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Refuse to publish anything that is not signed with the upload key.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certificate=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          [ -n "$certificate" ] || { echo "::error::The APK is not signed."; exit 1; }
          checksum=$(cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")")
          echo "$checksum" > "$apk.sha256"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ControlRoom for Android $version. Every feature is free.

          **Install:** download \`$(basename "$apk")\` on your phone and open it, or let [Obtainium](https://obtainium.imranr.dev/) install and update it from this repository. How-to: https://vandijkcloud.nl/Scaleway-ControlRoom/support.html#android

          **Check it:**
          - SHA-256 of the APK: \`${checksum%% *}\`
          - Signing certificate SHA-256: \`$certificate\`. Every release is signed with this same certificate.

          ControlRoom is an independent app. It is not made, endorsed or supported by Scaleway.
          NOTES
          gh release create "android-v$version" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "ControlRoom for Android $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      # Kept also when the upload fails: Play wants the very first bundle
      # uploaded by hand in the Play Console.
      - name: Keep the bundle
        if: env.CHANNEL == 'play' && env.BUILD == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: android-play-${{ env.BUILD_NUMBER || github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: ignore

      # Checked only now, so the very first bundle can be built (and uploaded
      # by hand) before the service account exists.
      - name: Check the service account
        if: env.CHANNEL == 'play'
        env:
          PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER || secrets.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT || secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Missing repository variable PLAY_WORKLOAD_IDENTITY_PROVIDER or PLAY_SERVICE_ACCOUNT, so the bundle was not uploaded. It is kept as an artifact of this run. See android/PLAY_STORE.md."
            exit 1
          fi

      - name: Sign in to Google Cloud
        if: env.CHANNEL == 'play'
        id: google
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER || secrets.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT || secrets.PLAY_SERVICE_ACCOUNT }}

      # fastlane supply does for Google Play what deliver does for the
      # iPhone app; it signs in with the credentials the step above wrote
      # (GOOGLE_APPLICATION_CREDENTIALS). PlayStore/ is converted to its layout.
      - name: Install fastlane
        if: env.CHANNEL == 'play' && (env.BUILD == 'true' || inputs.push_listing)
        run: |
          sudo gem install fastlane -v 2.241.2 --no-document
          python3 scripts/listing_to_fastlane.py

      - name: Upload to Google Play's internal track
        if: env.CHANNEL == 'play' && env.BUILD == 'true'
        env:
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || secrets.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          fastlane supply \
            --package_name com.pvd.scwcontrolroom \
            --track internal \
            --release_status "$STATUS" \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --metadata_path fastlane/metadata/android \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

      # The service account needs "Manage store presence" for these two.
      # supply attaches a listing to a track's release: the internal one.
      - name: Push the store listing and graphics
        if: env.CHANNEL == 'play' && inputs.push_listing
        run: |
          fastlane supply \
            --package_name com.pvd.scwcontrolroom \
            --metadata_path fastlane/metadata/android \
            --track internal \
            --skip_upload_apk \
            --skip_upload_aab \
            --skip_upload_changelogs \
            --sync_image_upload

      - name: Sync the Pro subscription
        if: env.CHANNEL == 'play' && inputs.push_subscriptions
        run: |
          python3 -m venv "$RUNNER_TEMP/play-venv"
          "$RUNNER_TEMP/play-venv/bin/pip" install --quiet google-auth requests
          "$RUNNER_TEMP/play-venv/bin/python" scripts/sync_subscriptions.py

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
