# Builds the Android app, signed with the upload key, for one channel:
#   github     the APK as a GitHub Release, every feature free (-Pstore=github).
#              Obtainium and the website's download link pick it up there.
#   play-test  the bundle for a Google Play closed test, Pro from the test store.
#   play       the bundle for Google Play production, Pro through Play Billing.
# The Play bundles are kept as artifacts: the upload to Google Play is not set
# up (see android/PLAY_STORE.md).
#
# Manual trigger only. Repository secrets (android/DISTRIBUTION.md says how to
# make the key):
#   UPLOAD_KEYSTORE_BASE64    the upload keystore (.jks), base64 encoded
#   UPLOAD_KEYSTORE_PASSWORD  its password
#   UPLOAD_KEY_ALIAS          the key's alias
#   UPLOAD_KEY_PASSWORD       the key's password
# Every GitHub release must be signed with this same key, or phones refuse
# the update.
name: Android release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Where the build goes
        type: choice
        options: [github, play-test, play]
        default: github

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count; a shallow clone would report 1.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Validate the Play Store listing
        run: python3 scripts/validate_listing.py

      - name: Write the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See android/DISTRIBUTION.md."
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Tests and build
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          number=$(git rev-list --count HEAD)
          echo "Building as build $number"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          case "$CHANNEL" in
            github) task=assembleRelease; store=github ;;
            play-test) task=bundleRelease; store=test ;;
            play) task=bundleRelease; store=play ;;
          esac
          ./gradlew :kit:test :app:testDebugUnitTest ":app:$task" -Pstore="$store" -PversionCode="$number" --console=plain

      - name: Publish the GitHub release
        if: inputs.channel == 'github'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marketing=$(grep -oP 'versionName = "\K[0-9.]+(?=\.\$versionCode")' app/build.gradle.kts)
          version="$marketing.$BUILD_NUMBER"
          apk="$RUNNER_TEMP/ControlRoom-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Refuse to publish anything that is not signed with the upload key.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certificate=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          [ -n "$certificate" ] || { echo "::error::The APK is not signed."; exit 1; }
          checksum=$(cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")")
          echo "$checksum" > "$apk.sha256"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ControlRoom for Android $version. Every feature is free.

          **Install:** download \`$(basename "$apk")\` on your phone and open it, or let [Obtainium](https://obtainium.imranr.dev/) install and update it from this repository. How-to: https://vandijkcloud.nl/Scaleway-ControlRoom/support.html#android

          **Check it:**
          - SHA-256 of the APK: \`${checksum%% *}\`
          - Signing certificate SHA-256: \`$certificate\`. Every release is signed with this same certificate.

          ControlRoom is an independent app. It is not made, endorsed or supported by Scaleway.
          NOTES
          gh release create "android-v$version" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "ControlRoom for Android $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      # Placeholder until the upload to Google Play is set up. Then: upload
      # the first bundle by hand in the Play Console (Play requires that), add
      # a PLAY_SERVICE_ACCOUNT_JSON secret, and replace this step with
      # r0adkll/upload-google-play.
      - name: Upload to Google Play (not set up yet)
        if: inputs.channel != 'github'
        run: echo "::notice::The upload to Google Play is not set up. The bundle is kept as an artifact of this run."

      - name: Keep the bundle
        if: inputs.channel != 'github'
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.channel }}-${{ env.BUILD_NUMBER || github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
