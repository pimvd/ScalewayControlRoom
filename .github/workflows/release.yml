# Archives the app and uploads it to TestFlight, and pushes the store text and
# screenshots from AppStore/ to the version being prepared in App Store Connect.
# Submission for review stays manual.
#
# Manual trigger only. Needs three repository secrets, from App Store Connect ->
# Users and Access -> Integrations -> App Store Connect API. The key needs the
# ADMIN role, not App Manager: cloud signing has to create the distribution
# certificate and profile, and only Admin may manage certificates.
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the team's issuer ID, shown above the key list
#   ASC_KEY_P8      the AuthKey_<id>.p8 file: its contents as they are
#                   (-----BEGIN PRIVATE KEY----- and all), or base64 encoded.
name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_build:
        description: Archive and upload a build to TestFlight
        type: boolean
        default: true
      push_metadata:
        description: Push the store text and screenshots
        type: boolean
        default: true
      push_subscriptions:
        description: Create or update the Pro subscriptions (AppStore/subscriptions.json)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# The iOS app lives in ios/.
defaults:
  run:
    working-directory: ios

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count; a shallow clone would
          # report 1 and App Store Connect would refuse the upload.
          fetch-depth: 0

      - name: Check the secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          if [ "${{ inputs.upload_build }}" != "true" ] && [ "${{ inputs.push_metadata }}" != "true" ] && [ "${{ inputs.push_subscriptions }}" != "true" ]; then
            echo "::error::Nothing to do: turn on upload_build, push_metadata or push_subscriptions."
            exit 1
          fi

      - name: Validate App Store metadata
        run: |
          python3 scripts/validate_metadata.py
          python3 scripts/validate_subscriptions.py

      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks for the key here; xcodebuild is given the path directly.
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          if printf '%s' "$ASC_KEY_P8" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$key"
          fi
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 is neither a .p8 nor base64 of one."
            exit 1
          fi
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.upload_build
        with:
          xcode-version: latest-stable

      - name: Package tests (ControlRoomKit)
        if: inputs.upload_build
        working-directory: ios/Packages/ControlRoomKit
        run: swift test

      - name: Archive
        if: inputs.upload_build
        run: |
          # The build number is the commit count, so every upload is unique
          # and increasing. A shallow clone would report 1.
          number=$(git rev-list --count HEAD)
          echo "Building as build $number"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project ScalewayControlRoom.xcodeproj \
            -scheme ScalewayControlRoom \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$number" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"
        shell: bash -o pipefail {0}

      - name: Export
        if: inputs.upload_build
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist AppStore/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
        shell: bash -o pipefail {0}

      - name: Upload to TestFlight
        if: inputs.upload_build
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)
          [ -n "$ipa" ] || { echo "::error::No .ipa was exported"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Push the store text and screenshots
        if: inputs.push_metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 scripts/metadata_to_fastlane.py
          # fastlane wants the key as JSON rather than a bare .p8.
          python3 - <<'PYTHON' > "$RUNNER_TEMP/asc_key.json"
          import json, os, pathlib
          print(json.dumps({
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": pathlib.Path(os.environ["ASC_KEY_PATH"]).read_text(),
              "in_house": False,
          }))
          PYTHON
          version=$(grep -m1 MARKETING_VERSION ScalewayControlRoom.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//')
          bundle_id=$(python3 -c "import json; print(json.load(open('AppStore/app.json'))['bundle_id'])")
          echo "Pushing metadata for $bundle_id version $version"
          # No pictures committed yet? Then leave App Store Connect's alone
          # rather than wiping them.
          screenshots=(--screenshots_path fastlane/screenshots --overwrite_screenshots true)
          if [ -z "$(find fastlane/screenshots -name '*.png' 2>/dev/null | head -1)" ]; then
            echo "No screenshots committed; skipping them."
            screenshots=(--skip_screenshots true)
          fi
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_identifier "$bundle_id" \
            --app_version "$version" \
            --metadata_path fastlane/metadata \
            "${screenshots[@]}" \
            --skip_binary_upload true \
            --force true \
            --run_precheck_before_submit false \
            --submit_for_review false || {
            echo "::error::deliver failed. A 'No data' crash in fetch_app_store_review_detail means App Store Connect has no App Review Information for this version yet. Fill it in first; see MANUAL_METADATA.md step 1."
            exit 1
          }

      - name: Sync the Pro subscriptions
        if: inputs.push_subscriptions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # A virtual environment, because the runner's Homebrew Python refuses
          # package installs into itself (PEP 668).
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/asc-venv/bin/python" scripts/sync_subscriptions.py

      # Archiving made Apple create a development certificate whose key lives
      # only on this runner. Left behind, these fill the team's certificate
      # limit (shared with every other app) until archiving fails. Only the
      # certificates in this runner's keychain are revoked.
      - name: Revoke this run's development certificate
        if: always() && inputs.upload_build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          fingerprints=$(security find-certificate -a -c "Created via API" -Z 2>/dev/null \
            | awk '/^SHA-1 hash:/ { print $3 }' | sort -u)
          python3 -m venv "$RUNNER_TEMP/revoke-venv"
          "$RUNNER_TEMP/revoke-venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/revoke-venv/bin/python" scripts/revoke_runner_certificates.py $fingerprints

      - name: Remove the API key
        if: always()
        run: |
          rm -f ~/.appstoreconnect/private_keys/*.p8
          rm -f "$RUNNER_TEMP/asc_key.json"

      - name: Upload logs and the app
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.BUILD_NUMBER || github.run_number }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: ignore
