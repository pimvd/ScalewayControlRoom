# Takes the App Store screenshots of the demo in the iOS simulator and commits
# them to AppStore/screenshots/en-US. The website deploy picks them up too.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A fresh simulator takes minutes to boot the first time: start it now,
      # so it boots while the app compiles.
      - name: Start booting the simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devices if "iOS" in k), reverse=True):
              for d in sorted(devices[runtime], key=lambda d: d["name"], reverse=True):
                  if d["name"].endswith("Pro Max"):
                      print(d["udid"]); sys.exit()
          sys.exit("No Pro Max simulator")
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/ccache
        with:
          key: simulator

      - name: Build for the simulator
        run: |
          npx expo prebuild --platform ios --clean
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$(basename "$workspace" .xcworkspace)" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          ccache --show-stats

      - name: Take the screenshots
        run: scripts/screenshots.sh

      - name: Remove the alpha channel
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" scripts/flatten_png.py AppStore/screenshots/en-US/*.png

      - name: Keep them as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: AppStore/screenshots/en-US/*.png
          retention-days: 14

      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppStore/screenshots/en-US
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update App Store screenshots"
          # The build leaves generated changes behind; only the pictures are committed.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
