# Checks every push to master and every pull request. Needs no secrets.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Expo dependency versions
        run: npx expo install --check

      - name: App Store metadata
        run: python3 scripts/validate_metadata.py

  # Proves the native iOS project still compiles. Unsigned, for the simulator,
  # so it needs no Apple credentials.
  ios:
    needs: check
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild build \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            2>&1 | tee "$RUNNER_TEMP/build.log"
        shell: bash -o pipefail {0}

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
