# Checks every push to master and every pull request. Needs no secrets.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: App Store metadata and subscriptions
        run: |
          python3 scripts/validate_metadata.py
          python3 scripts/validate_subscriptions.py
          python3 -m unittest discover -s scripts/tests -t .

  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Package tests (ControlRoomKit)
        working-directory: Packages/ControlRoomKit
        run: swift test 2>&1 | tee "$RUNNER_TEMP/package-tests.log"
        shell: bash -o pipefail {0}

      # Proves the app compiles. Unsigned, for the simulator, so it needs no
      # Apple credentials.
      - name: Build the app for the simulator
        run: |
          xcodebuild build \
            -project ScalewayControlRoom.xcodeproj \
            -scheme ScalewayControlRoom \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            2>&1 | tee "$RUNNER_TEMP/build.log"
        shell: bash -o pipefail {0}

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
